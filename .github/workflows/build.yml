name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore .\SteadyDim.csproj

      - name: Build
        run: dotnet build .\SteadyDim.csproj -c Release --no-restore

      - name: Package release
        shell: pwsh
        run: ./build-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SteadyDim-win-x64
          path: dist/SteadyDim-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SteadyDim-win-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: SteadyDim-win-x64.zip
          generate_release_notes: true
